# Run the spatial-transcriptomics Snakemake workflow in a container.
#
#   docker compose build                                              # build the image (pre-bakes the conda env)
#   docker compose run --rm scstseq --cores 8                         # everything (QC → processing → spatial → report)
#   docker compose run --rm scstseq --cores 8 qc_all                  # one stage
#   docker compose run --rm scstseq -n                                # dry run
#
# The whole project directory is mounted at /workflow, so the container reads your
# code + data/ vendor directories and writes results/ back to the host. The
# pre-built conda env lives at /opt/wf-conda inside the image (not under /workflow),
# so the mount does not hide it.

services:
  scstseq:
    build:
      context: .
      dockerfile: Dockerfile
    image: scstseq-pipeline:latest
    working_dir: /workflow
    volumes:
      - ./:/workflow
    # Write outputs as the host user (avoids root-owned results/). Export
    # DOCKER_UID/DOCKER_GID or edit these defaults as needed.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
    # Default command; override on the CLI (see examples above). The image's
    # ENTRYPOINT already sets `--use-conda ...`, so this only needs the
    # Snakefile, the cores (and an optional target).
    command: ["-s", "workflow/Snakefile", "--cores", "8"]
